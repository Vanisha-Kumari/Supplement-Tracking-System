<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="dashboard.css">

</head>


<body>


    <!-- Navbar -->

    <div class="navbar">

        <div class="logo">
            <i class="fa-solid fa-capsules"></i>
            Supplement Tracker
        </div>

        <nav>

            <a href="dashboard.html">
                <i class="fa-solid fa-house"></i>
                HOME
            </a>

            <a href="#">
                LOGIN
            </a>

            <a href="#">
                ABOUT
            </a>

            <a href="#">
                CONTACT
            </a>

        </nav>

    </div>


    <!-- Welcome Section -->

    <div class="home">

        <h1>
            Welcome to the Supplement Tracking System
        </h1>

        <p>
            Manage your supplements and never miss your daily dose.
        </p>

    </div>


    <!-- Main Cards -->

    <div class="main">


        <!-- Add Supplement -->

        <div class="box">

            <div class="icon">
                <i class="fa-solid fa-pills"></i>
            </div>

            <h3>Add Supplement</h3>

            <p>
                Add your daily supplements easily.
            </p>

            <button id="add">
                Add Supplement
            </button>

        </div>


        <!-- View Supplements -->

        <div class="box">

            <div class="icon">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </div>

            <h3>Supplement History</h3>

            <p>
                View and manage your supplements.
            </p>

            <button id="view">
                View History
            </button>

        </div>


        <!-- Reminders -->

        <div class="box">

            <div class="icon">
                <i class="fa-solid fa-bell"></i>
            </div>

            <h3>Reminders</h3>

            <p>
                Never miss your supplement dose.
            </p>

            <button id="reminder">
                Check Reminders
            </button>

        </div>


    </div>


    <script src="dashboard.js"></script>

</body>

</html>
